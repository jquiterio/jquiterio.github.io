<style>
/* Layout: technical-document grid. Section labels sit in a narrow left rail like margin notes;
   content runs in the right column. Signature element: the live γGN density. */
:root{
  --paper:#F4F5F8; --surface:#FFFFFF; --ink:#131827; --muted:#586074;
  --rule:#D8DCE6; --accent:#2446C4; --accent-soft:#E4E9FA;
  --f-display:"Spectral","Iowan Old Style",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --rail:170px; --max:1120px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D111A; --surface:#141A26; --ink:#E6E9F1; --muted:#98A0B3;
    --rule:#262D3C; --accent:#8AA3FF; --accent-soft:#1B2442; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D111A; --surface:#141A26; --ink:#E6E9F1; --muted:#98A0B3;
  --rule:#262D3C; --accent:#8AA3FF; --accent-soft:#1B2442; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
img{max-width:100%; height:auto}
a{color:var(--accent); text-underline-offset:3px; text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
h1,h2,h3{font-family:var(--f-display); font-weight:500; text-wrap:balance; margin:0; line-height:1.2}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:var(--max); margin:0 auto; padding-inline:clamp(16px,4vw,40px)}
.label{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.label a{color:inherit; text-decoration:none}
.label a:hover{color:var(--accent)}
.skip{position:absolute; left:-9999px}
.skip:focus{left:16px; top:12px; z-index:100; background:var(--surface); padding:8px 12px}

/* header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:color-mix(in srgb,var(--paper) 90%,transparent);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--rule)}
.top .wrap{display:flex; align-items:center; gap:20px; min-height:60px}
.brand{font-family:var(--f-display); font-size:1.18rem; font-weight:500; color:var(--ink); text-decoration:none; white-space:nowrap}
.nav{margin-left:auto; display:flex; gap:22px; overflow-x:auto; scrollbar-width:none; min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:.9rem; color:var(--muted); text-decoration:none; white-space:nowrap; padding-block:18px; border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}

/* hero */
.hero{padding-block:clamp(40px,7vw,88px) clamp(40px,6vw,72px)}
.hero-grid{display:grid; grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr); gap:clamp(32px,5vw,64px); align-items:start}
.hero h1{font-size:clamp(2.15rem,4.6vw,3.55rem); line-height:1.08; letter-spacing:-.012em; margin-top:16px}
.hero h1 em{font-style:italic; color:var(--accent)}
.lede{margin-top:24px; font-size:1.08rem; max-width:60ch}
.lede + .lede{margin-top:12px; color:var(--muted); font-size:1rem}
.actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:30px}
.btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:4px; background:var(--ink); color:var(--paper);
  text-decoration:none; font-weight:500; font-size:.9rem; border:1px solid var(--ink); cursor:pointer; font-family:var(--f-body); line-height:1.3}
.btn:hover{background:var(--accent); border-color:var(--accent); color:var(--paper)}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--accent); color:var(--accent)}

/* blocks */
.block{border-top:1px solid var(--rule); padding-block:clamp(44px,6vw,72px)}
.block-grid{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:clamp(20px,4vw,56px)}
.rail .label{position:sticky; top:88px; display:block}
.block h2{font-size:clamp(1.55rem,2.8vw,2.1rem); max-width:30ch}
.intro{margin-top:12px; color:var(--muted); max-width:62ch}

/* entries */
.entries{list-style:none; margin:22px 0 0; padding:0}
.entry{display:grid; grid-template-columns:104px minmax(0,1fr); gap:20px; padding-block:18px; border-bottom:1px solid var(--rule)}
.entry:first-child{border-top:1px solid var(--rule)}
.entry time{font-family:var(--f-mono); font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:4px}
.entry h3{font-size:1.2rem; line-height:1.3}
.entry h3 a{color:var(--ink); text-decoration:none}
.entry h3 a:hover{color:var(--accent); text-decoration:underline}
.entry p{margin-top:6px; font-size:.93rem; color:var(--muted); max-width:70ch}
.where{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; align-items:center}
.src{font-family:var(--f-mono); font-size:.7rem; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.status{margin-top:22px; padding:18px; border:1px dashed var(--rule); border-radius:6px; color:var(--muted); font-size:.95rem}

/* topics overview */
.topics{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:40px 48px; margin-top:28px}
.topic{border-top:2px solid var(--ink); padding-top:14px; min-width:0}
.topic h3{font-size:1.4rem}
.topic h3 a{color:var(--ink); text-decoration:none}
.topic h3 a:hover{color:var(--accent)}
.topic > p{margin-top:6px; font-size:.93rem; color:var(--muted)}
.topic ul{list-style:none; margin:14px 0 0; padding:0}
.topic li{padding-block:9px; border-bottom:1px solid var(--rule); font-size:.95rem; display:flex; justify-content:space-between; gap:14px}
.topic li a{color:var(--ink); text-decoration:none; min-width:0}
.topic li a:hover{color:var(--accent); text-decoration:underline}
.topic li time{font-family:var(--f-mono); font-size:.75rem; color:var(--muted); white-space:nowrap; padding-top:3px}
.topic .none{color:var(--muted); font-size:.9rem; padding-block:10px}

/* page head */
.page-head{padding-block:clamp(40px,7vw,80px) clamp(24px,4vw,40px)}
.page-head h1{font-size:clamp(2.1rem,4.6vw,3.2rem); line-height:1.1; margin-top:14px; max-width:22ch}
.page-head .standfirst{margin-top:18px; font-size:1.1rem; max-width:62ch; color:var(--muted)}

/* article */
.article-head{padding-block:clamp(40px,7vw,80px) 26px; max-width:760px}
.article-head h1{font-size:clamp(2rem,4.2vw,3rem); line-height:1.12; letter-spacing:-.01em; margin-top:14px}
.dek{margin-top:18px; font-size:1.15rem; color:var(--muted)}
.byline{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:22px; font-size:.82rem; color:var(--muted); font-family:var(--f-mono)}
.prose{max-width:720px; padding-bottom:clamp(40px,6vw,72px); font-size:1.06rem; line-height:1.72}
.prose > * + *{margin-top:1.1em}
.prose h2{font-size:1.6rem; margin-top:2em}
.prose h3{font-size:1.25rem; margin-top:1.6em}
.prose ul,.prose ol{padding-left:1.3em}
.prose li + li{margin-top:.35em}
.prose blockquote{margin-left:0; padding-left:20px; border-left:2px solid var(--accent); font-family:var(--f-display); font-size:1.18rem}
.prose code{font-family:var(--f-mono); font-size:.88em; background:var(--accent-soft); padding:1px 5px; border-radius:3px}
.prose pre{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:16px; overflow-x:auto; font-size:.88rem; line-height:1.55}
.prose pre code{background:none; padding:0}
.prose table{border-collapse:collapse; width:100%; font-size:.93rem; display:block; overflow-x:auto}
.prose th,.prose td{border-bottom:1px solid var(--rule); padding:8px 14px 8px 0; text-align:left; vertical-align:top}
.prose th{font-family:var(--f-mono); font-weight:400; font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.prose hr{border:0; border-top:1px solid var(--rule); margin-block:2.4em}
.prose .math-display{overflow-x:auto; overflow-y:hidden; padding-block:6px}
.prose .gn{margin-block:2em}
.prose .refs{font-size:.92rem; color:var(--muted)}
.article-foot{border-top:1px solid var(--rule); padding-block:26px 64px; display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; max-width:720px}
.external-card{max-width:720px; padding:24px; border:1px solid var(--rule); border-radius:6px; background:var(--surface); margin-bottom:64px}
.external-card p{color:var(--muted)}
.external-card .btn{margin-top:18px}

/* γGN figure */
.gn{background:var(--surface); border:1px solid var(--rule); border-radius:6px; padding:20px 20px 16px; margin:0}
.gn-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.gn-title{font-family:var(--f-display); font-style:italic; font-size:1.12rem}
.gn-legend{display:flex; gap:16px; font-size:.74rem; color:var(--muted); font-family:var(--f-mono)}
.gn-legend i{display:inline-block; width:14px; height:0; border-top:2px solid var(--accent); vertical-align:middle; margin-right:6px}
.gn-legend i.ref{border-top:2px dashed var(--muted)}
.gn canvas{display:block; width:100%; height:220px; margin-top:12px}
.gn.full canvas{height:300px}
.gn-row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px}
.gn input[type=range]{width:100%; accent-color:var(--accent); margin:6px 0 0}
.gn-ticks{display:flex; justify-content:space-between; margin-top:6px; gap:8px}
.gn-ticks button,.gn-toggle{font:inherit; font-family:var(--f-mono); font-size:.72rem; color:var(--muted); background:none; border:0; padding:4px 0; cursor:pointer}
.gn-ticks button:hover,.gn-ticks button[aria-pressed="true"]{color:var(--accent)}
.gn-toggle{border:1px solid var(--rule); border-radius:3px; padding:3px 8px}
.gn-toggle[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
.gn-readout{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; border-top:1px solid var(--rule); padding-top:12px}
.gn.full .gn-readout{grid-template-columns:repeat(4,minmax(0,1fr))}
.gn-readout div{min-width:0}
.gn-readout b{display:block; font-family:var(--f-mono); font-weight:500; font-size:1rem; font-variant-numeric:tabular-nums}
.gn-readout span{font-size:.72rem; color:var(--muted)}
.gn-note{margin-top:12px; font-size:.85rem; color:var(--muted); line-height:1.5}

/* about */
.about-grid{display:grid; grid-template-columns:minmax(0,1fr) 240px; gap:clamp(28px,5vw,60px); align-items:start}
.about-grid .bio > * + *{margin-top:1em}
.about-grid .bio{max-width:64ch}
.portrait{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:6px; filter:grayscale(1); border:1px solid var(--rule)}
.elsewhere{list-style:none; margin:28px 0 0; padding:0; max-width:64ch}
.elsewhere li{display:flex; justify-content:space-between; gap:16px; padding-block:11px; border-bottom:1px solid var(--rule); font-size:.95rem}
.elsewhere li:first-child{border-top:1px solid var(--rule)}
.elsewhere span{color:var(--muted)}
.contact-row{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:22px}
.email{font-family:var(--f-mono); font-size:1.02rem; user-select:all; padding:9px 14px; border:1px solid var(--rule); border-radius:4px; background:var(--surface); overflow-wrap:anywhere}
.copied{font-size:.85rem; color:var(--accent); min-height:1.2em}

footer{border-top:1px solid var(--rule); padding-block:32px 44px; font-size:.85rem; color:var(--muted)}
footer .wrap{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px}
footer nav{display:flex; flex-wrap:wrap; gap:8px 20px}
footer a{color:var(--muted); text-decoration:none}
footer a:hover{color:var(--accent)}

@media (max-width:900px){
  .hero-grid,.about-grid{grid-template-columns:minmax(0,1fr)}
  .about-grid .portrait{max-width:200px; order:-1}
  .block-grid{grid-template-columns:minmax(0,1fr); gap:10px}
  .rail .label{position:static}
}
@media (max-width:640px){
  .top .wrap{gap:14px}
  .nav{gap:16px}
  .topics{grid-template-columns:minmax(0,1fr)}
  .entry{grid-template-columns:minmax(0,1fr); gap:4px}
  .gn canvas{height:190px}
  .gn.full canvas{height:230px}
  .gn.full .gn-readout{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<script>
(function () {
"use strict";

/* ============================================================================
   CONFIGURATION — the only part you normally edit
   ========================================================================== */
var REPO = "jquiterio/jquiterio.github.io";

// Minimal front matter: key: value, "quoted", [lists], true/false
function frontMatter(text) {
  var meta = {}, body = text;
  var m = /^---\s*\n([\s\S]*?)\n---\s*\n?/.exec(text);
  if (m) {
