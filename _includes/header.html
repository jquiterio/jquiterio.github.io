<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Jorge Quitério</a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Main">
      {%- for s in site.data.sections -%}
        {%- assign here = false -%}
        {%- if page.url contains s.url or page.section == s.id -%}{%- assign here = true -%}{%- endif %}
      <a href="{{ s.url | relative_url }}"{% if here %} aria-current="page"{% endif %}>{{ s.title }}</a>
      {%- endfor %}
      <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/writing/' | relative_url }}"{% if page.url == '/writing/' %} aria-current="page"{% endif %}>Writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
